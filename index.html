<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b14">
<meta name="description" content="Promptária — contexto, rastreabilidade, correferência e execução com precisão.">
<title>Promptária</title>
<meta name="promptaria-build" content="2026-10-18-functional-correference-v1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#101624;--line:#26334a;--text:#edf3ff;--muted:#9aa9c2;--cyan:#62f3e2;--violet:#9c8cff;--pink:#e8a5ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#18224b 0,transparent 38%),radial-gradient(ellipse at 8% 30%,#103b3d44 0,transparent 35%),var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}a{color:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.topbar{min-height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:750;letter-spacing:-.04em;font-size:1.2rem}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#63f3e2,#8c7bff);color:#071019;font-weight:900}.hero{padding:70px 0 76px;display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:center}.hero-copy{max-width:680px}.hero h1{font-size:clamp(3rem,5.5vw,5.5rem);line-height:1;letter-spacing:-.075em;margin:18px 0}.hero h1 span{background:linear-gradient(100deg,var(--cyan),#9da2ff 68%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{font-size:1.06rem;color:var(--muted);max-width:540px;margin:0}.section{padding:0 0 64px}.section h2{font-size:clamp(2rem,3vw,3rem);line-height:1.05;letter-spacing:-.055em;margin:0 0 28px}.searchbox{width:100%;padding:18px 22px;border:1px solid #ffffff1a;border-radius:16px;background:#0b1020;color:var(--text);font:inherit;outline:none;box-shadow:inset 0 1px 0 #ffffff08}.searchbox::placeholder{color:#6f7c93}.searchbox:focus{border-color:#62f3e255;box-shadow:0 0 0 3px #62f3e212}.instruments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.instrument{border:1px solid #ffffff10;border-radius:20px;background:linear-gradient(145deg,#101827,#0c1120);padding:22px;min-height:210px;display:flex;flex-direction:column;gap:12px}.instrument.featured{border-color:#62f3e244;box-shadow:0 0 36px #62f3e20d}.instrument h3{font-size:1.05rem;line-height:1.3;margin:0;letter-spacing:-.025em}.instrument p{margin:0;color:var(--muted);font-size:.9rem}.meta{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid #ffffff14;border-radius:999px;padding:3px 9px;color:#b9c6dc;font-size:.72rem}.instrument-actions{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.trace{color:#6f7c93;font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.open-doc{border:1px solid #62f3e233;border-radius:10px;background:#62f3e20d;color:var(--cyan);padding:8px 12px;font:inherit;font-size:.78rem;cursor:pointer}.empty{grid-column:1/-1;color:var(--muted);padding:24px;border:1px dashed #ffffff14;border-radius:16px}.visual{position:relative;min-height:380px;display:grid;place-items:center;border:1px solid #ffffff10;border-radius:30px;background:radial-gradient(ellipse at center,#141d35aa,transparent 68%);overflow:hidden}.orb{position:absolute;width:230px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#6bf5e744,transparent 42%),radial-gradient(circle at 65% 65%,#927cff44,transparent 50%);filter:blur(3px)}.orbit{position:absolute;width:290px;height:165px;border:1px solid #62f3e244;border-radius:50%;transform:rotate(-32deg)}.orbit.two{width:320px;height:210px;transform:rotate(52deg);border-color:#a292ff40}.core{width:112px;height:112px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#18263b,#101624);border:1px solid #8cfff455;box-shadow:0 0 60px #62f3e222;z-index:1;font-size:2.5rem;font-weight:800;color:var(--cyan)}.footer{border-top:1px solid #ffffff12;padding:24px 0 34px;color:#77859d;font-size:.78rem}.doc-overlay{position:fixed;inset:0;background:#050812dd;backdrop-filter:blur(8px);display:none;z-index:10;padding:30px}.doc-overlay.open{display:grid;place-items:center}.doc-panel{width:min(900px,100%);max-height:90vh;overflow:auto;border:1px solid #ffffff18;border-radius:22px;background:#0c1220;padding:26px;box-shadow:0 20px 80px #0008}.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.doc-head h3{margin:0;font-size:1.1rem;line-height:1.35;overflow-wrap:anywhere}.doc-tools{align-items:center;flex-wrap:wrap;margin-left:0;display:flex;gap:10px}.copy-prompt{border:1px solid #62f3e255;border-radius:10px;background:#62f3e215;color:var(--cyan);padding:7px 12px;cursor:pointer}.copy-prompt:disabled{opacity:.5;cursor:wait}.doc-body{margin-top:18px;white-space:pre-wrap;color:#cbd6e8;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.status{color:#71809a;font-size:.78rem;margin-top:12px}
@media(max-width:760px){.wrap{width:min(100% - 30px,560px)}.topbar{min-height:68px}.hero{padding:42px 0 52px;grid-template-columns:1fr;gap:24px}.visual{order:-1;min-height:260px}.hero h1{font-size:clamp(2.8rem,13vw,4.2rem)}.section{padding-bottom:44px}.section h2{font-size:2rem;margin-bottom:22px}.searchbox{padding:16px 18px}.instruments{grid-template-columns:1fr}.footer{padding-bottom:24px}.doc-overlay{padding:15px}}
</style>
</head>
<body>
<header class="wrap topbar"><a class="brand" href="#plataforma" aria-label="Promptária — início"><span class="logo" aria-hidden="true">P.</span><span>Promptária</span></a></header>
<main class="wrap">
<section class="hero" id="plataforma" aria-labelledby="hero-title">
<div class="hero-copy"><h1 id="hero-title">Ideias claras.<br><span>Execução precisa.</span></h1><p class="lead">Encontre, recupere e aplique instrumentos promptuais com clareza, contexto e rastreabilidade.</p></div>
<div class="visual" aria-hidden="true"><div class="orb"></div><div class="orbit"></div><div class="orbit two"></div><div class="core">P<span>.</span></div></div>
</section>
<section class="section" id="instrumentos" aria-labelledby="instrumentos-title">
<h2 id="instrumentos-title">Instrumentos promptuais</h2>
<input class="searchbox" id="instrument-search" type="search" aria-label="Buscar instrumentos promptuais" placeholder="Buscar por nome ou finalidade...">
<div class="instruments" id="instrument-list" aria-live="polite"></div>
</section>
</main>
<footer class="wrap footer"><span>© Promptária</span></footer>
<div class="doc-overlay" id="doc-overlay" role="dialog" aria-modal="true" aria-label="Leitor de instrumento promptual"><div class="doc-panel"><div class="doc-head"><h3 id="doc-title"></h3><div class="doc-tools"><button class="copy-prompt" id="copy-prompt" type="button">Copiar prompt</button></div></div><div class="doc-body" id="doc-body"></div><div class="status" id="doc-status" aria-live="polite"></div></div></div>
<script>
const registryUrl='./config/instrument-registry.json?v=20261018-functional-correference-1';
const list=document.getElementById('instrument-list');
const search=document.getElementById('instrument-search');
const overlay=document.getElementById('doc-overlay');
const copyPrompt=document.getElementById('copy-prompt');
let currentPrompt='';
const docStatus=document.getElementById('doc-status');
const docTitle=document.getElementById('doc-title');
const docBody=document.getElementById('doc-body');
const closeDoc=()=>overlay.classList.remove('open');
function normalize(value){return String(value||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s-]/g,' ').toLowerCase().replace(/[\s-]+/g,' ').trim();}
function haystack(item){return normalize([item.title,...(item.aliases||[]),...(item.keywords||[]),...(item.functions||[]),...(item.relations||[]),...(item.operations||[])].join(' '));}
function resolveInstrumentReference(reference){
 const normalized=normalize(reference);
 if(!normalized)return {status:'empty',matches:[],trace:null};
 const active=registry.filter(item=>item.activation?.enabled===true);
 const exact=(item,value)=>normalize(value)===normalized;
 const candidates=[];
 for(const item of active){
  if(exact(item,item.id))candidates.push({item,kind:'id'});
  else if(exact(item,item.path))candidates.push({item,kind:'path'});
  else if(exact(item,item.title))candidates.push({item,kind:'title'});
  else if((item.aliases||[]).some(alias=>exact(item,alias)))candidates.push({item,kind:'alias'});
 }
 const unique=[...new Map(candidates.map(x=>[x.item.id,x])).values()];
 if(unique.length!==1)return {status:unique.length?'ambiguous':'unresolved',matches:unique.map(x=>x.item),trace:null};
 const match=unique[0];
 const trace={id:match.item.id,title:match.item.title,path:match.item.path,matched_term:reference,match_kind:match.kind,normalized_term:normalized};
 return {status:'resolved',matches:[match.item],trace};
}
function render(items){
 if(!items.length){list.innerHTML='<div class="empty">Nenhum instrumento corresponde aos termos pesquisados.</div>';return;}
 list.innerHTML=items.map(item=>{
  const featured=item.ui?.featured?' featured':'';
  return `<article class="instrument${featured}" data-id="${escapeHtml(item.id)}"><h3>${escapeHtml(item.title)}</h3><div class="instrument-actions"><button class="open-doc" type="button" data-path="${escapeHtml(item.path)}" data-title="${escapeHtml(item.title)}">Abrir instrumento</button></div></article>`;
 }).join('');
 list.querySelectorAll('.open-doc').forEach(button=>button.addEventListener('click',()=>openDoc(button.dataset.path,button.dataset.title,'ui')));
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
async function openDoc(path,title,source='ui',trace=null){
 overlay.classList.add('open');docTitle.textContent=title||'';docStatus.textContent=trace?`Resolvido por ${trace.match_kind}: ${trace.id} → ${trace.path}`:'';docBody.textContent='';currentPrompt='';copyPrompt.disabled=true;
 try{const response=await fetch(`./${path}?v=20261018-functional-correference-1`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);currentPrompt=await response.text();docBody.textContent=currentPrompt;if(!trace&&source==='ui')docStatus.textContent='Referência funcional resolvida pelo registro canônico.';copyPrompt.disabled=false;}catch(error){docStatus.textContent='Não foi possível carregar o arquivo publicado neste site. Verifique se o caminho do instrumento existe no GitHub Pages.';docBody.textContent='';currentPrompt='';copyPrompt.disabled=true;}
}
copyPrompt.addEventListener('click',async()=>{if(!currentPrompt)return;try{await navigator.clipboard.writeText(currentPrompt);docStatus.textContent='Prompt copiado.';}catch(error){const area=document.createElement('textarea');area.value=currentPrompt;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const copied=document.execCommand('copy');area.remove();docStatus.textContent=copied?'Prompt copiado.':'Não foi possível copiar automaticamente. Selecione e copie o texto manualmente.';}});
overlay.addEventListener('click',event=>{if(event.target===overlay)closeDoc();});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDoc();});
let registry=[];
fetch(registryUrl,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}).then(data=>{registry=(data.instruments||[]).filter(item=>item.activation?.enabled===true);render(registry);}).catch(error=>{list.innerHTML=`<div class="empty">Catálogo indisponível. A interface não presumirá instrumentos que não puder recuperar. ${escapeHtml(error.message)}</div>`;});
search.addEventListener('keydown',event=>{if(event.key!=='Enter')return;const resolved=resolveInstrumentReference(search.value);if(resolved.status==='resolved'){openDoc(resolved.trace.path,resolved.trace.title,'reference',resolved.trace);}else{overlay.classList.add('open');docTitle.textContent='Referência não resolvida';docBody.textContent='';currentPrompt='';copyPrompt.disabled=true;docStatus.textContent=resolved.status==='ambiguous'?'Referência ambígua: use o identificador ou caminho do instrumento.':'Nenhum instrumento ativo corresponde exatamente à referência informada.';} });
search.addEventListener('input',()=>{const query=normalize(search.value).trim();if(!query){render(registry);return;}const terms=query.split(/\s+/).filter(Boolean);render(registry.filter(item=>{const text=haystack(item);return terms.every(term=>text.includes(term));}));});
window.Promptaria = Object.freeze({resolveInstrumentReference});
</script>
</body>
</html>
