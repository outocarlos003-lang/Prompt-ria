name: Promptária Integração por Comentário

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  prepare-pull-request:
    if: github.event.issue.pull_request != null && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/promptaria merge ')
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit approval for exact head SHA and trigger checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          base="$(jq -r '.base.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          state="$(jq -r '.state' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          if [[ "$base" != "main" || "$head_repo" != "$REPOSITORY" || "$state" != "open" ]]; then
            echo "PR rejected: expected an open same-repository PR targeting main."
            exit 1
          fi
          expected="/promptaria merge $head_sha"
          if [[ "$COMMENT_BODY" != "$expected" ]]; then
            echo "Approval must name the exact current PR head SHA: $expected"
            exit 1
          fi
          draft="$(jq -r '.draft' <<< "$pr")"
          if [[ "$draft" == "true" ]]; then
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
            echo "PR marked ready; ready_for_review will run the required checks."
            exit 0
          fi
          runs="$(gh run list --repo "$REPOSITORY" --workflow promptaria-tests.yml --branch "$head_ref" --json databaseId,headSha,status,event --limit 100)"
          run_id="$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha and .status == "completed" and .event == "pull_request")] | first | .databaseId // empty' <<< "$runs")"
          if [[ -n "$run_id" ]]; then
            gh run rerun "$run_id" --repo "$REPOSITORY"
            echo "Re-ran checks for the explicitly approved exact SHA."
          elif [[ "$(jq --arg sha "$head_sha" '[.[] | select(.headSha == $sha and .status != "completed" and .event == "pull_request")] | length' <<< "$runs")" -gt 0 ]]; then
            echo "Checks for the approved SHA are already in progress; waiting for their result."
          else
            echo "No test run found for the approved SHA; refusing to trigger integration."
            exit 1
          fi
