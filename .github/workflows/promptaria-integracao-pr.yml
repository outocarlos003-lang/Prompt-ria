name: Promptária - integração controlada de PRs

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

jobs:
  ready-and-merge:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/promptaria merge' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate same-repository PR targeting main
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          state="$(jq -r '.state' <<<"$pr")"
          if [[ "$base" != "main" || "$head_repo" != "$REPOSITORY" || "$state" != "open" ]]; then
            echo "Recusado: o PR deve estar aberto, vir deste repositório e apontar para main." >&2
            exit 1
          fi
          echo "sha=$(jq -r '.head.sha' <<<"$pr")" >> "$GITHUB_OUTPUT"
      - name: Wait for current PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --watch
      - name: Mark ready and request squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --auto
