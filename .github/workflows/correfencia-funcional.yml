name: Correferência funcional dos instrumentos promptuais

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Requisição textual a validar contra os títulos da Promptária"
        required: false
        type: string
  repository_dispatch:
    types: [promptaria-correfencia]
  pull_request:
    paths:
      - ".github/scripts/validate_promptaria_corref.py"
      - ".github/workflows/correfencia-funcional.yml"
      - "tests/test_correfencia_funcional.py"
      - "Promptária/**"
      - "index.html"
  push:
    branches: ["**"]
    paths:
      - ".github/scripts/validate_promptaria_corref.py"
      - ".github/workflows/correfencia-funcional.yml"
      - "tests/test_correfencia_funcional.py"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testar validador de correferência
        run: python3 -m unittest discover -s tests -p "test_correfencia_funcional.py" -v

  validar-correfencia:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar requisição
        env:
          PROMPT_INPUT: ${{ inputs.prompt }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          prompt = os.environ.get("PROMPT_INPUT", "").strip()
          if not prompt:
              payload = json.loads(os.environ.get("EVENT_PAYLOAD", "{}") or "{}")
              prompt = str(payload.get("prompt", "")).strip()
          if not prompt:
              raise SystemExit("Nenhuma requisição foi fornecida.")
          Path("promptaria-request.txt").write_text(prompt, encoding="utf-8")
          PY
      - name: Validar correferência
        run: |
          python3 .github/scripts/validate_promptaria_corref.py \
            --prompt-file promptaria-request.txt \
            --output correfencia-result.json
      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: correfencia-funcional
          path: correfencia-result.json

  validar-navegacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar rede navegacional da Promptária
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("Promptária")
          entries = sorted(p for p in root.glob("*/Index.html"))
          assert len(entries) == 11, f"Esperados 11 instrumentos, encontrados {len(entries)}"
          index = root / "Index.html"
          main = index.read_text(encoding="utf-8")
          for entry in entries:
              rel = entry.relative_to(root).as_posix()
              assert rel in main, f"Instrumento não indexado: {rel}"
              html = entry.read_text(encoding="utf-8")
              assert 'id="promptaria-network-style"' in html, f"Sem camada navegacional: {entry}"
              assert 'href="../Index.html"' in html, f"Sem retorno ao núcleo: {entry}"
              assert 'href="../../index.html"' in html, f"Sem retorno à interface principal: {entry}"
              assert 'id="promptaria-search-form"' in html, f"Sem pesquisa transversal: {entry}"
          hrefs = re.findall(r'href="([^"]+)"', main)
          for href in hrefs:
              if href.startswith("./"):
                  target = (root / href[2:]).resolve()
                  assert target.is_file(), f"Destino inexistente no índice: {href}"
          print(f"OK: {len(entries)} instrumentos conectados, indexados e com retorno/pesquisa.")
          PY
