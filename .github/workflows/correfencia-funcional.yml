name: Correferência funcional dos instrumentos promptuais

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Requisição textual a validar contra os títulos da Promptária"
        required: false
        type: string
  repository_dispatch:
    types: [promptaria-correfencia]
  pull_request:
    paths:
      - ".github/scripts/validate_promptaria_corref.py"
      - ".github/scripts/build_correfencia_execution_bundle.py"
      - ".github/workflows/correfencia-funcional.yml"
      - "tests/test_correfencia_funcional.py"
      - "Promptária/**"
      - "index.html"
      - ".github/README-correfencia.md"
  push:
    branches: ["**"]
    paths:
      - ".github/scripts/validate_promptaria_corref.py"
      - ".github/scripts/build_correfencia_execution_bundle.py"
      - ".github/workflows/correfencia-funcional.yml"
      - "tests/test_correfencia_funcional.py"
      - "Promptária/**"
      - "index.html"
      - ".github/README-correfencia.md"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testar validador de correferência
        run: python3 -m unittest discover -s tests -p "test_correfencia_funcional.py" -v

  validar-correfencia:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar requisição
        env:
          PROMPT_INPUT: ${{ inputs.prompt }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          prompt = os.environ.get("PROMPT_INPUT", "").strip()
          if not prompt:
              payload = json.loads(os.environ.get("EVENT_PAYLOAD", "{}") or "{}")
              prompt = str(payload.get("prompt", "")).strip()
          if not prompt:
              raise SystemExit("Nenhuma requisição foi fornecida.")
          Path("promptaria-request.txt").write_text(prompt, encoding="utf-8")
          PY
      - name: Validar correferência e plano de execução
        run: |
          python3 .github/scripts/validate_promptaria_corref.py \
            --prompt-file promptaria-request.txt \
            --output correfencia-result.json
      - name: Verificar arquitetura complementar
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("correfencia-result.json").read_text(encoding="utf-8"))
          c = result.get("coordination")
          assert isinstance(c, dict), "Bloco coordination ausente"
          assert c["cardinality"]["additional_is_unbounded"] is True
          assert c["cardinality"]["maximum_additional"] is None
          assert c["coordination"]["is_fusion"] is False
          assert c["multidirectory"]["enabled"] is True
          assert c["multidirectory"]["nocturna_is_not_default"] is True
          assert c["traceability"]["required"] is True
          assert c["validation"]["all_additional_titles_represented"] is True
          assert c["activation_unit"]["title_plus_request_are_joint_entry"] is True
          assert c["instrument_application_separation"]["identity_is_not_changed_by_contextual_variation"] is True
          assert c["destination_resolution"]["weak_thematic_association_is_never_sufficient"] is True
          assert c["writing_coordination"]["destructive_resolution_requires_integrity_validation"] is True
          assert c["validation"]["final_validation_is_coordinated"] is True
          print("OK: arquitetura complementar íntegra.")
          PY
      - name: Recuperar instrumentos acionados
        run: |
          python3 .github/scripts/build_correfencia_execution_bundle.py \
            --input correfencia-result.json \
            --output correfencia-execution-bundle.json
      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: correfencia-funcional
          path: |
            correfencia-result.json
            correfencia-execution-bundle.json

  validar-navegacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar rede navegacional e fonte única de verdade
        run: node Promptária/verificador-integridade.mjs
