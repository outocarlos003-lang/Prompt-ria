name: Promptária Auto-merge Seguro

on:
  workflow_run:
    workflows: ["Promptária PR Checks", "Promptária Integração por Comentário"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  merge-tested-pull-request:
    if: github.event.workflow_run.name == 'Promptária PR Checks' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Verify every check on the tested commit and merge only that commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER:-}" || -z "$TESTED_SHA" ]]; then
            echo "Missing pull request number or tested SHA."
            exit 1
          fi
          checks="$(gh api "repos/$GH_REPO/commits/$TESTED_SHA/check-runs?per_page=100")"
          total_checks="$(jq -r '.total_count' <<< "$checks")"
          returned_checks="$(jq '.check_runs | length' <<< "$checks")"
          if [[ "$total_checks" -lt 1 || "$returned_checks" -ne "$total_checks" ]]; then
            echo "Check-run list is empty or incomplete; refusing to merge."
            exit 1
          fi
          if [[ "$(jq '[.check_runs[] | select(.status != "completed")] | length' <<< "$checks")" -ne 0 ]]; then
            echo "At least one check-run is not completed."
            exit 1
          fi
          if [[ "$(jq '[.check_runs[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$checks")" -ne 0 ]]; then
            echo "At least one check-run did not succeed."
            exit 1
          fi
          pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr")"
          base="$(jq -r '.base.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          if [[ "$state" != "open" || "$base" != "main" || "$head_repo" != "$GH_REPO" || "$draft" != "false" ]]; then
            echo "PR state, base, origin, or draft status failed validation."
            exit 1
          fi
          if [[ "$head_sha" != "$TESTED_SHA" ]]; then
            echo "Current PR head differs from tested SHA."
            exit 1
          fi
          current="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [[ "$current" != "$TESTED_SHA" ]]; then
            echo "PR head changed during validation."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$TESTED_SHA"
