name: Promptária - correferência funcional por título

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Demanda completa a processar"
        required: true
        type: string
      destination:
        description: "Destino opcional proposto para a demanda (não grava por si só)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Apenas validar e gerar plano, sem gravar resultado"
        required: true
        type: boolean
        default: true
      executor_request_json:
        description: "Opcional: JSON estruturado para validar uma operação write_text em simulação"
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: promptaria-correfencia-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '/promptaria'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare request from event
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REQUEST: ${{ inputs.request }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import json, os
          event = os.environ.get('EVENT_NAME', '')
          request = os.environ.get('INPUT_REQUEST', '')
          dry_run = os.environ.get('INPUT_DRY_RUN', 'true').lower() == 'true'
          if event == 'issue_comment':
              body = os.environ.get('COMMENT_BODY', '')
              request = body.split('/promptaria', 1)[1].strip()
              # Comments are validation-only: never treat an absent input as permission to write.
              dry_run = True
          if not request.strip():
              raise SystemExit('Demanda vazia.')
          with open('request.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'request': request,
                  'destination': os.environ.get('INPUT_DESTINATION', '').strip(),
                  'dry_run': dry_run,
                  'source_event': event
              }, f, ensure_ascii=False, indent=2)
          PY
      - name: Resolve all instrument titles and validate plan
        run: python scripts/promptaria_resolver.py --request request.json --instruments instruments --output promptaria-result.json
      - name: Validate resolution completeness and traceability
        run: python scripts/promptaria_validate_result.py --result promptaria-result.json
      - name: Prepare optional executor request (forced simulation)
        id: prepare_executor
        env:
          EXECUTOR_REQUEST_JSON: ${{ inputs.executor_request_json }}
        run: python scripts/promptaria_prepare_executor_request.py
      - name: Validate structured operation with executor
        if: steps.prepare_executor.outputs.enabled == 'true'
        run: python scripts/promptaria_executor.py --request executor-request.json --repo-root . --output executor-result.json
      - name: Upload traceable resolution result
        uses: actions/upload-artifact@v4
        with:
          name: promptaria-result-${{ github.run_id }}
          path: promptaria-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload executor simulation and audit
        if: steps.prepare_executor.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: promptaria-executor-${{ github.run_id }}
          path: |
            executor-result.json
            .promptaria/audit.jsonl
          if-no-files-found: error
          retention-days: 30
