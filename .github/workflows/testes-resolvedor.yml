name: Testes do resolvedor Promptária

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes de regressão
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe do resolvedor
        run: python -m py_compile scripts/promptaria_resolver.py
