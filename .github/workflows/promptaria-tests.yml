name: Promptária PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - recovery/restore-canonical-paths

permissions:
  contents: read

jobs:
  resolver-js:
    name: JavaScript resolver contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check resolver syntax
        run: node --check .github/scripts/resolver-correferencia.mjs
      - name: Run resolver contract tests
        run: node --test tests/resolver-correferencia.test.mjs
